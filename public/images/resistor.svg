<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" width="760" height="696">
  <rect width="760" height="696" fill="#f8f8f8"/>

  <!-- Shadow -->
  <rect x="224" y="312" width="312" height="116" rx="6" fill="#000" opacity="0.08"/>

  <!-- SMD Resistor body -->
  <rect x="220" y="298" width="320" height="110" rx="6" fill="#d4d0c8" stroke="#aaa" stroke-width="1.5"/>

  <!-- Top face gradient -->
  <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8e4dc"/>
    <stop offset="40%" stop-color="#d4d0c8"/>
    <stop offset="100%" stop-color="#b8b4ac"/>
  </linearGradient>
  <rect x="220" y="298" width="320" height="110" rx="6" fill="url(#bodyGrad)"/>

  <!-- Left silver end cap -->
  <linearGradient id="capGradL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c8c8c8"/>
    <stop offset="100%" stop-color="#e8e8e8"/>
  </linearGradient>
  <rect x="220" y="298" width="54" height="110" rx="6" fill="url(#capGradL)" stroke="#aaa" stroke-width="1"/>
  <rect x="248" y="298" width="26" height="110" fill="#d8d8d8"/>

  <!-- Right silver end cap -->
  <linearGradient id="capGradR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e8e8e8"/>
    <stop offset="100%" stop-color="#b8b8b8"/>
  </linearGradient>
  <rect x="486" y="298" width="54" height="110" rx="6" fill="url(#capGradR)" stroke="#aaa" stroke-width="1"/>
  <rect x="486" y="298" width="26" height="110" fill="#d8d8d8"/>

  <!-- Resistor value marking band -->
  <rect x="274" y="298" width="212" height="110" fill="#c8c4bc"/>

  <!-- Value text on resistor -->
  <text x="380" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222" letter-spacing="2">430Ω</text>
  <text x="380" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">F  T  L</text>

  <!-- Top highlight line -->
  <rect x="274" y="300" width="212" height="3" fill="#dedad2" opacity="0.7"/>

  <!-- PCB pads below end caps -->
  <rect x="215" y="390" width="60" height="18" rx="2" fill="#8B7355" opacity="0.3"/>
  <rect x="485" y="390" width="60" height="18" rx="2" fill="#8B7355" opacity="0.3"/>

  <!-- Product title -->
  <text x="380" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">Thick Film Resistor — 0805 SMD</text>
  <text x="380" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555">430 Ω · 125 mW · ±1%</text>

  <!-- Dimension indicators -->
  <line x1="220" y1="450" x2="540" y2="450" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888">2.0 mm × 1.25 mm (0805)</text>

  <!-- RoHS badge -->
  <rect x="330" y="510" width="100" height="26" rx="4" fill="#2a8442"/>
  <text x="380" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">RoHS</text>

  <!-- Brand -->
  <text x="380" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#aaa">Multicomp Pro</text>
</svg>
