<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" width="760" height="696">
  <rect width="760" height="696" fill="#f8f8f8"/>

  <!-- Shadow -->
  <rect x="244" y="254" width="276" height="220" rx="4" fill="#000" opacity="0.08"/>

  <!-- Main connector housing body -->
  <linearGradient id="housingGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f0f0f0"/>
    <stop offset="30%" stop-color="#e0e0e0"/>
    <stop offset="100%" stop-color="#c8c8c8"/>
  </linearGradient>
  <rect x="240" y="250" width="280" height="215" rx="4" fill="url(#housingGrad)" stroke="#aaa" stroke-width="1.5"/>

  <!-- Housing inner recess -->
  <rect x="250" y="260" width="260" height="195" rx="3" fill="#d0d0d0" stroke="#bbb" stroke-width="1"/>

  <!-- Housing locking tab top -->
  <rect x="300" y="234" width="160" height="22" rx="3" fill="#e0e0e0" stroke="#aaa" stroke-width="1"/>
  <rect x="310" y="238" width="140" height="14" rx="2" fill="#d0d0d0"/>

  <!-- 5 contact cavities with metal contacts -->
  <g>
    <!-- Cavity 1 -->
    <rect x="264" y="278" width="36" height="160" rx="2" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
    <rect x="268" y="282" width="28" height="150" rx="1" fill="#1a1a1a"/>
    <!-- Gold contact -->
    <rect x="272" y="310" width="20" height="90" rx="1" fill="#d4a830"/>
    <rect x="273" y="315" width="18" height="4" fill="#e8c040"/>
    <rect x="273" y="340" width="18" height="4" fill="#e8c040"/>
    <rect x="273" y="365" width="18" height="4" fill="#e8c040"/>
    <rect x="273" y="390" width="18" height="4" fill="#e8c040"/>

    <!-- Cavity 2 -->
    <rect x="312" y="278" width="36" height="160" rx="2" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
    <rect x="316" y="282" width="28" height="150" rx="1" fill="#1a1a1a"/>
    <rect x="320" y="310" width="20" height="90" rx="1" fill="#d4a830"/>
    <rect x="321" y="315" width="18" height="4" fill="#e8c040"/>
    <rect x="321" y="340" width="18" height="4" fill="#e8c040"/>
    <rect x="321" y="365" width="18" height="4" fill="#e8c040"/>
    <rect x="321" y="390" width="18" height="4" fill="#e8c040"/>

    <!-- Cavity 3 -->
    <rect x="362" y="278" width="36" height="160" rx="2" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
    <rect x="366" y="282" width="28" height="150" rx="1" fill="#1a1a1a"/>
    <rect x="370" y="310" width="20" height="90" rx="1" fill="#d4a830"/>
    <rect x="371" y="315" width="18" height="4" fill="#e8c040"/>
    <rect x="371" y="340" width="18" height="4" fill="#e8c040"/>
    <rect x="371" y="365" width="18" height="4" fill="#e8c040"/>
    <rect x="371" y="390" width="18" height="4" fill="#e8c040"/>

    <!-- Cavity 4 -->
    <rect x="412" y="278" width="36" height="160" rx="2" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
    <rect x="416" y="282" width="28" height="150" rx="1" fill="#1a1a1a"/>
    <rect x="420" y="310" width="20" height="90" rx="1" fill="#d4a830"/>
    <rect x="421" y="315" width="18" height="4" fill="#e8c040"/>
    <rect x="421" y="340" width="18" height="4" fill="#e8c040"/>
    <rect x="421" y="365" width="18" height="4" fill="#e8c040"/>
    <rect x="421" y="390" width="18" height="4" fill="#e8c040"/>

    <!-- Cavity 5 -->
    <rect x="462" y="278" width="36" height="160" rx="2" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
    <rect x="466" y="282" width="28" height="150" rx="1" fill="#1a1a1a"/>
    <rect x="470" y="310" width="20" height="90" rx="1" fill="#d4a830"/>
    <rect x="471" y="315" width="18" height="4" fill="#e8c040"/>
    <rect x="471" y="340" width="18" height="4" fill="#e8c040"/>
    <rect x="471" y="365" width="18" height="4" fill="#e8c040"/>
    <rect x="471" y="390" width="18" height="4" fill="#e8c040"/>
  </g>

  <!-- SMD pads extending from bottom -->
  <rect x="264" y="462" width="36" height="22" rx="2" fill="#c8a020" opacity="0.9"/>
  <rect x="312" y="462" width="36" height="22" rx="2" fill="#c8a020" opacity="0.9"/>
  <rect x="362" y="462" width="36" height="22" rx="2" fill="#c8a020" opacity="0.9"/>
  <rect x="412" y="462" width="36" height="22" rx="2" fill="#c8a020" opacity="0.9"/>
  <rect x="462" y="462" width="36" height="22" rx="2" fill="#c8a020" opacity="0.9"/>

  <!-- Pin number labels -->
  <text x="282" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">1</text>
  <text x="330" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">2</text>
  <text x="380" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">3</text>
  <text x="430" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">4</text>
  <text x="480" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">5</text>

  <!-- 1.5mm pitch label -->
  <line x1="282" y1="510" x2="330" y2="510" stroke="#bbb" stroke-width="1"/>
  <text x="306" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">1.5mm</text>

  <!-- Product title -->
  <text x="380" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">JST ACH Series Male Header</text>
  <text x="380" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#555">5 Contacts · 1.5mm Pitch · SMD</text>

  <!-- Brand -->
  <text x="380" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#aaa">JST</text>
</svg>
